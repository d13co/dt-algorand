name: release

# Version tags publish a GitHub release with the dtalgorand .deb and push it
# to https://apt.d13.co.
#
# The tag is v<x.y.z>-dt<n>: the upstream stable release the fork is based on
# (x.y.z) plus a fork revision (n, from 1 on each new base), e.g. v5.0.2-dt1.
# The .deb's version is the tag without the leading v, and the binaries report
# the upstream version (algod -v says 5.0.2). build_deb.sh works both out from
# git: the nearest upstream v*-stable tag and the dt tag at HEAD. The check
# below fails if either disagrees with the tag, e.g. when v5.0.3-dt1 is tagged
# before upstream's v5.0.3-stable is merged. Upstream's own tags
# (v5.0.2-stable, ...) don't match.
#
# The .deb is built on the runner (cgo, host architecture only), so this
# publishes amd64 for now. Build arm64 on an arm64 host/runner to add it.
#
# The darwin job builds the macOS (Apple silicon) tarball on a Mac runner in
# parallel, darwin-release attaches it to the same release, and homebrew points
# the d13co/tap formula at it.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-dt[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'd13co/dt-algorand'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build stamps the version from git describe
          persist-credentials: false # make runs below; only the release needs the token
      - uses: ./.github/actions/setup-go
        with:
          cache-prefix: buildsrc
      - uses: ./.github/actions/setup-test
      - name: Fetch upstream's release tags
        run: git fetch --no-tags https://github.com/algorand/go-algorand.git 'refs/tags/v*-stable:refs/tags/v*-stable'
      - name: Build the .deb
        env:
          BRANCH: dtalgorand # else a tag checkout stamps the branch as HEAD
        run: installer/dtalgorand/build_deb.sh dist
      - name: Check the versions
        run: |
          v=${GITHUB_REF_NAME#v}
          base=${v%-dt*}
          d=$(dpkg-deb -f dist/*.deb Version)
          a=$(dpkg-deb -f dist/*.deb Architecture)
          [ "$d" = "$v" ] || { echo "the .deb says $d, tag is $GITHUB_REF_NAME"; exit 1; }
          [ "$a" = amd64 ] || { echo "the .deb is for $a, not amd64"; exit 1; }
          # algod -v prints <major>.<minor>.<build number>.<channel> on its second line
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/deb"
          b=$("$RUNNER_TEMP/deb/usr/lib/dtalgorand/bin/algod" -v | sed -n 2p)
          case "$b" in "$base".*) ;; *) echo "algod says $b, tag is $GITHUB_REF_NAME"; exit 1 ;; esac
          (cd dist && sha256sum ./*.deb > checksums.txt && cat checksums.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run after a failed upload finds the release already there.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload --clobber "$GITHUB_REF_NAME" dist/*.deb dist/checksums.txt
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.deb dist/checksums.txt
          fi

  darwin:
    if: github.repository == 'd13co/dt-algorand'
    runs-on: macos-14 # arm64; the binaries run on this macOS release and later ones
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build stamps the version from git describe
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-prefix: buildsrc
      - uses: ./.github/actions/setup-test
      - name: Fetch upstream's release tags
        run: git fetch --no-tags https://github.com/algorand/go-algorand.git 'refs/tags/v*-stable:refs/tags/v*-stable'
      - name: Build the tarball
        env:
          BRANCH: dtalgorand # else a tag checkout stamps the branch as HEAD
        run: installer/dtalgorand/build_darwin.sh dist
      - name: Check the versions
        run: |
          v=${GITHUB_REF_NAME#v}
          base=${v%-dt*}
          f=dist/dtalgorand_${v}_darwin-arm64.tar.gz
          [ -f "$f" ] || { echo "no $f; built: $(ls dist)"; exit 1; }
          tar -xzf "$f" -C "$RUNNER_TEMP"
          d=$(cat "$RUNNER_TEMP/dtalgorand-$v/VERSION")
          [ "$d" = "$v" ] || { echo "the tarball says $d, tag is $GITHUB_REF_NAME"; exit 1; }
          b=$("$RUNNER_TEMP/dtalgorand-$v/bin/algod" -v | sed -n 2p)
          case "$b" in "$base".*) ;; *) echo "algod says $b, tag is $GITHUB_REF_NAME"; exit 1 ;; esac
          (cd dist && shasum -a 256 ./*.tar.gz > checksums-darwin.txt && cat checksums-darwin.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            dist/*.tar.gz
            dist/checksums-darwin.txt
          if-no-files-found: error

  # Separate from darwin so that the slow Mac build runs alongside the .deb's,
  # and the upload waits for release to create the release.
  darwin-release:
    needs: [release, darwin]
    if: github.repository == 'd13co/dt-algorand'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: darwin
          path: dist
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c checksums-darwin.txt)
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums-darwin.txt

  # Separate from darwin-release so a failed publish can be re-run on its own.
  homebrew:
    needs: darwin-release
    if: github.repository == 'd13co/dt-algorand'
    environment: homebrew # holds the tap's deploy key; v* tags only, needs approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: homebrew # one formula update at a time
    permissions:
      contents: read # the release's checksum; the tap is pushed with its deploy key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the tarball's checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -D dist -p checksums-darwin.txt
      - uses: actions/checkout@v4
        with:
          repository: d13co/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }} # write access to the tap only
      - name: Update the formula
        run: |
          v=${GITHUB_REF_NAME#v}
          name=dtalgorand_${v}_darwin-arm64.tar.gz
          sha=$(awk -v f="./$name" '$2 == f { print $1 }' dist/checksums-darwin.txt)
          [ -n "$sha" ] || { echo "no checksum for $name"; exit 1; }
          url=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name
          # the published tarball is the one the checksum describes
          curl -fsSL "$url" -o "$RUNNER_TEMP/$name"
          echo "$sha  $RUNNER_TEMP/$name" | sha256sum -c
          mkdir -p tap/Formula
          # an older tag's run, approved after a newer one's, leaves the formula alone
          cur=$(sed -n 's/^  version "\(.*\)"$/\1/p' tap/Formula/dtalgorand.rb 2>/dev/null || true)
          if [ -n "$cur" ] && [ "$cur" != "$v" ] && [ "$(printf '%s\n' "$cur" "$v" | sort -V | tail -n 1)" = "$cur" ]; then
            echo "the formula is at $cur, newer than $v"; exit 0
          fi
          installer/dtalgorand/homebrew/render.sh "$v" "$url" "$sha" > tap/Formula/dtalgorand.rb
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/dtalgorand.rb
          if git diff --cached --quiet; then echo "the formula is already at $v"; exit 0; fi
          git commit -m "dtalgorand $v"
          git push

  # Separate from release so a failed publish can be re-run on its own.
  apt:
    needs: release
    if: github.repository == 'd13co/dt-algorand'
    environment: apt # holds the signing and R2 secrets; v* tags only, needs approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: apt # one index rebuild at a time
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -D dist -p '*.deb' -p checksums.txt
          cd dist && sha256sum -c --ignore-missing checksums.txt
      - name: Install apt-ftparchive
        run: command -v apt-ftparchive || { sudo apt-get update && sudo apt-get install -y apt-utils; }
      - name: Import the signing subkey
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: echo "$APT_SIGNING_KEY" | gpg --batch --import
      - name: Publish to apt.d13.co
        env:
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          printf %s "$APT_SIGNING_PASSPHRASE" > "$RUNNER_TEMP/pass"
          GPG_PASSPHRASE_FILE=$RUNNER_TEMP/pass APT_REPO=$RUNNER_TEMP/apt .github/apt-publish.sh dist/*.deb
      - name: Check apt.d13.co lists the release
        run: |
          v=$(dpkg-deb -f dist/*.deb Version)
          curl -fsS "https://apt.d13.co/dists/stable/main/binary-amd64/Packages?v=$v" |
            grep -qx "Filename: pool/dtalgorand_${v}_amd64.deb" || { echo "no $v for amd64"; exit 1; }
