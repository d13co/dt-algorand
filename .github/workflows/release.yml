name: release

# Version tags publish a GitHub release with the dtalgorand .deb and push it
# to https://apt.d13.co.
#
# The tag is v<x.y.z>-dt<n>: the upstream stable release the fork is based on
# (x.y.z) plus a fork revision (n, which counts the fork's releases and doesn't
# restart on a new base), e.g. v5.0.4-dt3 then v5.0.5-dt4.
# The .deb's version is the tag without the leading v, and the binaries report
# the upstream version (algod -v says 5.0.2). build_deb.sh works both out from
# git: the nearest upstream v*-stable tag and the dt tag at HEAD. The check
# below fails if either disagrees with the tag, e.g. when v5.0.3-dt1 is tagged
# before upstream's v5.0.3-stable is merged. Upstream's own tags
# (v5.0.2-stable, ...) don't match.
#
# The .deb is built on the runner (cgo, host architecture only), so this
# publishes amd64 for now. Build arm64 on an arm64 host/runner to add it.
#
# The darwin job builds the macOS (Apple silicon) tarball on a Mac runner in
# parallel, darwin-release attaches it to the same release, and homebrew points
# the d13co/tap formula at it.
#
# Betas: a v<x.y.z>-dt<n>-beta<m> tag, on a commit of the beta branch, publishes
# a GitHub pre-release and the .deb <x.y.z>-dt<n>~beta<m> to apt.d13.co's beta
# suite (which lists the stable releases too; ~ sorts the beta before
# <x.y.z>-dt<n>). n is the release the beta leads up to, and x.y.z may be an
# upstream beta (v5.1.0-beta). No macOS tarball or Homebrew formula for betas.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-dt[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-dt[0-9]+-beta[0-9]+"

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'd13co/dt-algorand'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # the release
    outputs:
      suite: ${{ steps.channel.outputs.suite }}
      deb_version: ${{ steps.channel.outputs.deb_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build stamps the version from git describe
          persist-credentials: false # make runs below; only the release needs the token
      - name: Work out the channel
        id: channel
        run: |
          v=${GITHUB_REF_NAME#v}
          case $v in
          *-beta*)
            git fetch --no-tags origin +refs/heads/beta:refs/remotes/origin/beta ||
              { echo "no beta branch on origin: beta tags must be on it"; exit 1; }
            git merge-base --is-ancestor HEAD origin/beta ||
              { echo "$GITHUB_REF_NAME isn't on the beta branch: beta tags must be"; exit 1; }
            suite=beta branch=beta deb_version=${v%-beta*}~beta${v##*-beta} ;;
          *) suite=stable branch=dtalgorand deb_version=$v ;;
          esac
          echo "suite=$suite deb_version=$deb_version branch=$branch"
          { echo "suite=$suite"; echo "deb_version=$deb_version"; echo "branch=$branch"; } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-go
        with:
          cache-prefix: buildsrc
      - uses: ./.github/actions/setup-test
      - name: Fetch upstream's release tags
        # betas may be based on an upstream beta
        run: git fetch --no-tags https://github.com/algorand/go-algorand.git 'refs/tags/v*-stable:refs/tags/v*-stable' 'refs/tags/v*-beta:refs/tags/v*-beta'
      - name: Build the .deb
        env:
          BRANCH: ${{ steps.channel.outputs.branch }} # else a tag checkout stamps the branch as HEAD
        run: installer/dtalgorand/build_deb.sh dist
      - name: Check the versions
        env:
          DEB_VERSION: ${{ steps.channel.outputs.deb_version }}
          SUITE: ${{ steps.channel.outputs.suite }}
        run: |
          v=${GITHUB_REF_NAME#v}
          base=${v%%-dt*}
          d=$(dpkg-deb -f dist/*.deb Version)
          a=$(dpkg-deb -f dist/*.deb Architecture)
          [ "$d" = "$DEB_VERSION" ] || { echo "the .deb says $d, tag $GITHUB_REF_NAME wants $DEB_VERSION"; exit 1; }
          [ "$a" = amd64 ] || { echo "the .deb is for $a, not amd64"; exit 1; }
          # algod -v prints <major>.<minor>.<build number>.<channel> [<branch>] on its second
          # line; the channel is the suite's name
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/deb"
          b=$("$RUNNER_TEMP/deb/usr/lib/dtalgorand/bin/algod" -v | sed -n 2p)
          case "$b" in "$base.$SUITE "*) ;; *) echo "algod says $b, tag $GITHUB_REF_NAME wants $base.$SUITE"; exit 1 ;; esac
          # Name the asset after the tag: a beta's version has a ~, which GitHub may rewrite
          # in asset names (apt-publish.sh names the pool's copy from the .deb's fields).
          f=dist/dtalgorand_${v}_$a.deb
          [ -f "$f" ] || mv dist/*.deb "$f"
          (cd dist && sha256sum ./*.deb > checksums.txt && cat checksums.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ steps.channel.outputs.suite }}
        run: |
          # A re-run after a failed upload finds the release already there.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload --clobber "$GITHUB_REF_NAME" dist/*.deb dist/checksums.txt
          elif [ "$SUITE" = beta ]; then
            gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes dist/*.deb dist/checksums.txt
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.deb dist/checksums.txt
          fi

  darwin:
    # not for betas; darwin-release and homebrew then skip too
    if: github.repository == 'd13co/dt-algorand' && !contains(github.ref_name, '-beta')
    runs-on: macos-15 # arm64
    timeout-minutes: 90
    env:
      # the oldest macOS the binaries run on, the formula's minimum; for
      # libsodium too, which setup-test builds
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build stamps the version from git describe
          persist-credentials: false
      - uses: ./.github/actions/setup-darwin
      - name: Fetch upstream's release tags
        run: git fetch --no-tags https://github.com/algorand/go-algorand.git 'refs/tags/v*-stable:refs/tags/v*-stable'
      - name: Build the tarball
        env:
          BRANCH: dtalgorand # else a tag checkout stamps the branch as HEAD
        run: installer/dtalgorand/build_darwin.sh dist
      - name: Check the versions
        run: |
          v=${GITHUB_REF_NAME#v}
          base=${v%-dt*}
          f=dist/dtalgorand_${v}_darwin-arm64.tar.gz
          [ -f "$f" ] || { echo "no $f; built: $(ls dist)"; exit 1; }
          tar -xzf "$f" -C "$RUNNER_TEMP"
          d=$(cat "$RUNNER_TEMP/dtalgorand-$v/VERSION")
          [ "$d" = "$v" ] || { echo "the tarball says $d, tag is $GITHUB_REF_NAME"; exit 1; }
          b=$("$RUNNER_TEMP/dtalgorand-$v/bin/algod" -v | sed -n 2p)
          case "$b" in "$base".*) ;; *) echo "algod says $b, tag is $GITHUB_REF_NAME"; exit 1 ;; esac
          (cd dist && shasum -a 256 ./*.tar.gz > checksums-darwin.txt && cat checksums-darwin.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: darwin
          path: |
            dist/*.tar.gz
            dist/checksums-darwin.txt
          if-no-files-found: error

  # Separate from darwin so that the slow Mac build runs alongside the .deb's,
  # and the upload waits for release to create the release.
  darwin-release:
    needs: [release, darwin]
    if: github.repository == 'd13co/dt-algorand'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: darwin
          path: dist
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c checksums-darwin.txt)
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums-darwin.txt

  # Separate from darwin-release so a failed publish can be re-run on its own.
  homebrew:
    needs: darwin-release
    if: github.repository == 'd13co/dt-algorand'
    environment: homebrew # holds the tap's deploy key; v* tags only, needs approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the release's checksum; the tap is pushed with its deploy key
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the tarball's checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -D dist -p checksums-darwin.txt
      - uses: actions/checkout@v7
        with:
          repository: d13co/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }} # write access to the tap only
      - name: Update the formula
        run: |
          v=${GITHUB_REF_NAME#v}
          name=dtalgorand_${v}_darwin-arm64.tar.gz
          sha=$(awk -v f="./$name" '$2 == f { print $1 }' dist/checksums-darwin.txt)
          [ -n "$sha" ] || { echo "no checksum for $name"; exit 1; }
          url=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name
          # the published tarball is the one the checksum describes
          curl -fsSL "$url" -o "$RUNNER_TEMP/$name"
          echo "$sha  $RUNNER_TEMP/$name" | sha256sum -c
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch=$(git rev-parse --abbrev-ref HEAD)
          # No concurrency group: GitHub would cancel a pending run when another queues, and
          # that tag's formula would never land. Runs that overlap instead retry on a rejected push.
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              sleep $((attempt * 5))
              git fetch --depth 1 origin "$branch"
              git reset --hard FETCH_HEAD
            fi
            mkdir -p Formula
            # an older tag's run, approved after a newer one's, leaves the formula alone
            cur=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/dtalgorand.rb 2>/dev/null || true)
            if [ -n "$cur" ] && [ "$cur" != "$v" ] && [ "$(printf '%s\n' "$cur" "$v" | sort -V | tail -n 1)" = "$cur" ]; then
              echo "the formula is at $cur, newer than $v"; exit 0
            fi
            ../installer/dtalgorand/homebrew/render.sh "$v" "$url" "$sha" > Formula/dtalgorand.rb
            git add Formula/dtalgorand.rb
            if git diff --cached --quiet; then echo "the formula is already at $v"; exit 0; fi
            git commit -m "dtalgorand $v"
            if git push origin "HEAD:$branch"; then exit 0; fi
            echo "the tap moved under this run (attempt $attempt); retrying"
          done
          exit 1

  # Separate from release so a failed publish can be re-run on its own.
  apt:
    needs: release
    if: github.repository == 'd13co/dt-algorand'
    environment: apt # holds the signing and R2 secrets; v* tags only, needs approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: apt # one index rebuild at a time
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -D dist -p '*.deb' -p checksums.txt
          cd dist && sha256sum -c --ignore-missing checksums.txt
      - name: Install apt-ftparchive
        run: command -v apt-ftparchive || { sudo apt-get update && sudo apt-get install -y apt-utils; }
      - name: Import the signing subkey
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: echo "$APT_SIGNING_KEY" | gpg --batch --import
      - name: Publish to apt.d13.co
        env:
          APT_SUITE: ${{ needs.release.outputs.suite }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          printf %s "$APT_SIGNING_PASSPHRASE" > "$RUNNER_TEMP/pass"
          GPG_PASSPHRASE_FILE=$RUNNER_TEMP/pass APT_REPO=$RUNNER_TEMP/apt .github/apt-publish.sh dist/*.deb
      - name: Check apt.d13.co lists the release
        env:
          SUITE: ${{ needs.release.outputs.suite }}
          DEB_VERSION: ${{ needs.release.outputs.deb_version }}
        run: |
          v=$DEB_VERSION
          pool=pool; [ "$SUITE" = stable ] || pool=pool-$SUITE
          curl -fsS "https://apt.d13.co/dists/$SUITE/main/binary-amd64/Packages?v=$v" |
            grep -qxF "Filename: $pool/dtalgorand_${v}_amd64.deb" || { echo "no $v for amd64 in $SUITE"; exit 1; }
