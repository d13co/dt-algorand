name: 'Set up Test Environment'
description: 'Set up testing environment for all platforms'
inputs:
  install-expect:
    description: 'Whether to install expect package'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    # a libsodium built for a newer macOS than MACOSX_DEPLOYMENT_TARGET would raise the
    # binaries' minimum, so the target is part of the key
    - name: Cache libsodium
      uses: actions/cache@v4
      with:
        path: crypto/libs
        key: libsodium-${{ runner.os }}-${{ runner.arch }}${{ env.MACOSX_DEPLOYMENT_TARGET && format('-macos{0}', env.MACOSX_DEPLOYMENT_TARGET) || '' }}-${{ hashFiles('crypto/libsodium-fork/**') }}
    - name: Build libsodium
      run: make libsodium
      shell: bash
    - name: Configure development environment
      if: runner.os != 'Linux'
      run: ./scripts/configure_dev.sh
      shell: bash
      # GHA Linux VMs provide all needed apt packages, except expect
    - name: Install expect package
      if: inputs.install-expect == 'true' && runner.os == 'Linux'
      run: |
        echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
        sudo dpkg-reconfigure -f noninteractive man-db
        sudo apt-get install -y --no-upgrade expect
      shell: bash
